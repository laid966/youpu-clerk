# fly.io 部署配置（Plan B：无备案海外宿主）
# 区域选 hkg（香港）：大陆访问延迟可接受，支付宝回调也近。
# 评审期常驻不缩容：auto_stop_machines=false + min_machines_running=1
# （代价：shared-cpu-1x 约 $2-5/月，比"赶不上 12/9"便宜得多）

app = "youpu-clerk"
primary_region = "hkg"

[build]

[mounts]
source = "clerk_data"
destination = "/data"

[http_service]
internal_port = 8100
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
