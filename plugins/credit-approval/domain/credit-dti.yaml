# 信贷场景 · 负债收入比判定域
#
# ⚠️ 纯虚构演示规则，不构成任何信贷依据。

domain: credit-dti
version: 1.0.0
note: 纯虚构演示规则，不构成任何信贷依据。

verdicts: [approved, review, rejected]
default_verdict: rejected
critical_verdicts: []

facts:
  - name: sex
    type: enum
    values: [male, female]

  - name: age
    type: number
    minimum: 18
    maximum: 100
    boundaries: [60]

  - name: dti
    type: number
    unit: "%"
    minimum: 0
    maximum: 200
    boundaries: [50, 60, 70]

rules:
  - id: DTI-REJECT
    when: 'dti > 70'
    verdict: rejected
    cite: 信贷政策 5.1：负债收入比超过 70% 不予放款
    priority: 30

  - id: DTI-REVIEW
    when: 'dti > 60'
    verdict: review
    cite: 信贷政策 5.1：负债收入比 60%–70% 需人工复核
    priority: 20

  - id: DTI-APPROVE
    when: 'dti <= 50'
    verdict: approved
    cite: 信贷政策 5.1：负债收入比 50% 以内符合标准流程
    priority: 10

  - id: DTI-REVIEW-MID
    when: 'dti > 50'
    verdict: review
    cite: 信贷政策 5.1：负债收入比 60%–70% 需人工复核
    priority: 15

escalate:
  - when: 'age > 60'
    reason: 高龄申请人需人工复核还款能力
