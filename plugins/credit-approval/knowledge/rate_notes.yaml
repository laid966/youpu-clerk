# 信贷场景知识库（检索用）
#
# ⚠️ 内容为虚构演示，不构成任何信贷依据。
# 结构与 rag/knowledge/metric_notes.yaml 一致——**格式属于本体，内容属于插件。**

notes:
  - code: rate
    plain: 年化利率是把各项费用折算到整年之后的综合成本，用来横向比较不同产品的真实价格。
    factors: 利率高低与申请人资质、期限、担保方式、资金成本等因素有关，同一产品对不同人可能不同。
    action: 对利率有疑问时，以合同载明的年化利率与还款计划为准，不要只看月供金额。

  - code: dti
    plain: 负债收入比是每月还款额与月收入之比，用来衡量还款压力。
    factors: 收入波动、多头借贷、其他分期付款都会推高这一比值。
    action: 比值偏高时，通常需要补充收入证明或降低申请额度后再评估。
