# 理赔场景知识库（检索用）
#
# ⚠️ 内容为虚构演示，不构成任何理赔依据。

notes:
  - code: deductible
    plain: 免赔额是条款约定需要自己承担、不进入赔付计算的那部分金额。
    factors: 不同产品、不同责任的免赔额不同，同一份保单里也可能分项设定。
    action: 核对金额时以条款载明的免赔额为准；对计算有疑问可申请核赔复核。

  - code: payout_ratio
    plain: 赔付比例是扣除免赔额之后，条款约定可以赔付的百分比。
    factors: 比例与险种、责任类型、是否社保结算等因素有关。
    action: 比例超过条款上限时通常需要人工核赔，不会自动结案。
