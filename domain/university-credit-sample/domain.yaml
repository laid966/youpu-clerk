# 副场景：虚构的学分与毕业资格审核
# ⚠️ 纯虚构演示规则，数字与任何真实培养方案不同，不构成任何业务依据。
# 用途：证明"换一份配置就换一个行业"，引擎一行不用改。
# 待办（你的作业）：补充课程/班级数据文件，以及"时间表未公布"的处理规则。

domain: university-credit-sample
version: 0.1.0
note: 纯虚构，仅用于演示。

facts:
  - name: total_credits
    type: number
  - name: core_credits
    type: number
  - name: capstone_credits
    type: number
  - name: workshop_count
    type: number
  - name: campus
    type: enum
    values: [main, branch]
  - name: has_timetable_conflict
    type: bool
  - name: has_unpublished_schedule
    type: bool

rules:
  - id: U-001
    when: 'total_credits >= 60 and core_credits >= 36 and capstone_credits >= 12 and workshop_count >= 2 and campus == "main" and has_timetable_conflict == false'
    verdict: eligible
    fee:
      form: fixed
      amount: 0
    cite: '示例培养方案 第 2 节：毕业资格条件'
    priority: 10

  - id: U-002
    when: 'total_credits < 60'
    verdict: not_eligible
    fee:
      form: fixed
      amount: 0
    cite: '示例培养方案 第 2.1 条：总学分不足 60'
    priority: 20

  - id: U-003
    when: 'core_credits < 36'
    verdict: not_eligible
    fee:
      form: fixed
      amount: 0
    cite: '示例培养方案 第 2.2 条：核心课学分不足 36'
    priority: 20

escalate:
  - when: 'campus == "branch"'
    reason: 异地校区能否计入尚不明确，需人工确认
  - when: 'has_unpublished_schedule == true'
    reason: 部分课程时间表未公布，结论需标注"待复核"
  - when: 'missing_any_fact == true'
    reason: 关键信息缺失，不得猜测
