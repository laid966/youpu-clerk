# 医学分级示范域 · ALT（丙氨酸氨基转移酶）
#
# ⚠️ 仅供演示：参考区间取自公开通用成人区间，不同实验室略有差异，以本院报告为准。
# 本域只做「指标分级」，不做诊断、不给用药建议。
#
# 设计要点：default_verdict = normal —— 没有规则命中意味着「所有指标正常」，
# 这是最理想的情况，而不是规则集有缺口。这个语义由域声明，引擎不替它猜。

domain: med-alt
version: 0.1.0
note: 纯虚构演示规则，不构成任何业务依据。

verdicts: [normal, mild, marked, critical]
default_verdict: normal
critical_verdicts: [critical]

facts:
  - name: sex
    type: enum
    values: [male, female]

  - name: age
    type: number
    minimum: 0
    maximum: 120
    boundaries: [18, 65]

  - name: alt
    type: number
    unit: U/L
    minimum: 0
    maximum: 2000
    boundaries: [40, 50, 120, 300]

rules:
  - id: ALT-CRITICAL
    when: 'alt > 300'
    verdict: critical
    cite: 通用成人参考区间 9–50 U/L；>300 U/L 属危急值区间，须尽快就医
    priority: 30

  - id: ALT-MARKED
    when: 'alt > 120'
    verdict: marked
    cite: 通用成人参考区间 9–50 U/L；2–6 倍上限属明显升高
    priority: 20

  - id: ALT-MILD
    when: 'alt > 50'
    verdict: mild
    cite: 通用成人参考区间 9–50 U/L；轻度升高建议复查
    priority: 10

escalate:
  - when: 'age < 18'
    reason: 本版本仅覆盖成人参考区间，未成年人请咨询儿科医生
  - when: 'age > 100'
    reason: 高龄人群参考区间差异较大，建议由医生判读
