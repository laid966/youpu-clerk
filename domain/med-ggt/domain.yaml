# 医学分级示范域 · GGT（γ-谷氨酰转移酶）
# ⚠️ 仅供演示，参考区间为公开通用成人区间；不做诊断、不给用药建议。

domain: med-ggt
version: 0.1.0
note: 纯虚构演示规则，不构成任何业务依据。

verdicts: [normal, mild, marked, critical]
default_verdict: normal
critical_verdicts: [critical]

facts:
  - name: sex
    type: enum
    values: [male, female]

  - name: age
    type: number
    minimum: 0
    maximum: 120
    boundaries: [18, 65]

  - name: ggt
    type: number
    unit: U/L
    minimum: 0
    maximum: 3000
    boundaries: [45, 60, 180, 600]

rules:
  - id: GGT-CRITICAL
    when: 'ggt > 600'
    verdict: critical
    cite: 通用成人参考区间 10–60 U/L；超过 10 倍上限属危急值区间，须尽快就医
    priority: 30

  - id: GGT-MARKED
    when: 'ggt > 180'
    verdict: marked
    cite: 通用成人参考区间 10–60 U/L；超过 3 倍上限属明显升高
    priority: 20

  - id: GGT-MILD
    when: 'ggt > 60'
    verdict: mild
    cite: 通用成人参考区间 10–60 U/L；轻度升高建议复查
    priority: 10

escalate:
  - when: 'age < 18'
    reason: 本版本仅覆盖成人参考区间，未成年人请咨询儿科医生
  - when: 'age > 100'
    reason: 高龄人群参考区间差异较大，建议由医生判读
