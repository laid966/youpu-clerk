# L3 指南要点库（可引用）
#
# ⚠️ 这里的条目是**公开常识层面的通用要点**，仅供演示，**待项目作者审校并补充权威出处**。
# 规则：只写要点，不搬运原文；正式版本应逐条标注可核验的来源。

notes:
  - id: critical-value
    title: 什么是危急值，看到危急值应该怎么办
    text: 危急值是指明显偏离参考区间、需要尽快由医生处理的结果。看到危急值提示时应当尽快就医，而不是先自行观察或复查。本工具会把危急值置顶并强制转人工复核，不自行给出处理方案。

  - id: recheck
    title: 复查的意义与时间安排
    text: 单次结果偏离参考区间并不等于患病，复查的目的在于确认结果的稳定性并排除偶然波动。常见的复查时间窗是数周至三个月，具体间隔应由医生结合个人情况决定。

  - id: fasting
    title: 抽血前的准备
    text: 空腹血糖等项目要求空腹采血，通常需禁食八至十二小时，可少量饮水。前一晚应避免饮酒与剧烈运动，以免影响结果。抽血前是否真正空腹会直接影响空腹血糖的判读。

  - id: urate-diet
    title: 尿酸与日常饮食的一般关系
    text: 尿酸与嘌呤摄入相关。日常可注意减少动物内脏、浓肉汤、部分海产品与酒精的摄入，并保证饮水。饮食调整属于生活方式层面的一般建议，不能替代医生的评估与处置。

  - id: lipid-lifestyle
    title: 血脂与生活方式的一般关系
    text: 血脂水平与饮食结构、体重和运动习惯相关。一般建议减少饱和脂肪与反式脂肪摄入、增加运动、控制体重。是否需要进一步干预应由医生评估心血管整体风险后决定。

  - id: anemia
    title: 血红蛋白偏低的一般说明
    text: 血红蛋白偏低提示可能存在贫血，常见相关因素包括营养摄入、月经量偏多、慢性失血等。判断原因通常需要结合血常规中的其他指标，并由医生进一步检查。

  - id: disclaimer
    title: 本工具能做什么、不能做什么
    text: 本工具用于把体检报告中的指标翻译成易懂的说明，并帮助准备就医时的问题。它不提供诊断、治疗或用药建议，不能替代医生面诊。参考区间来自公开通用成人区间，不同实验室略有差异，请以本院报告为准。
