# L2 指标解释库（通俗解释）
#
# ⚠️ 内容为公开常识层面的通用说明，仅供演示；**待项目作者审校改写**。
# 这是分工里"人的部分"——措辞边界与通俗程度只有懂的人能判断。
# 不含诊断结论、不含用药建议。

notes:
  - code: alt
    plain: ALT（丙氨酸氨基转移酶）主要存在于肝细胞内。肝细胞受到刺激或损伤时，它会被释放到血液中，因此常被用作反映肝细胞状态的指标。
    factors: 单次轻度升高可能与近期饮酒、熬夜、剧烈运动、体重变化、合并其他疾病或部分药物有关，并不等同于肝脏疾病。
    action: 轻度升高通常建议 1–3 个月复查；明显升高或同时出现明显不适时，建议尽快到消化内科或肝病科门诊。

  - code: ast
    plain: AST（天门冬氨酸氨基转移酶）存在于肝脏、心肌和骨骼肌等多种组织，因此它的升高不如 ALT 特异，需要结合其他指标一起看。
    factors: 除肝脏外，剧烈运动、肌肉损伤等情况也可能影响 AST 数值。
    action: 建议与 ALT 一起解读；若两者同时明显升高，建议尽快门诊。

  - code: ggt
    plain: GGT（γ-谷氨酰转移酶）主要与胆道系统和肝脏相关，对饮酒等刺激比较敏感。
    factors: 饮酒、脂肪肝、胆道问题以及部分药物都可能与 GGT 升高有关。
    action: 轻度升高建议复查并回顾近期饮酒与用药情况；明显升高建议尽快门诊。

  - code: crea
    plain: 肌酐是肌肉代谢的产物，主要经肾脏排出，因此常被用来评估肾脏的滤过能力。它的参考区间男女不同。
    factors: 肌肉量、饮食结构、剧烈运动、脱水以及部分药物都可能影响肌酐水平。
    action: 轻度升高建议复查；明显升高建议尽快到肾内科门诊，并同时关注尿素氮等指标。

  - code: ua
    plain: 尿酸是嘌呤代谢的终产物，参考区间男女不同。长期偏高与痛风风险相关，但单次升高不等于痛风发作。
    factors: 高嘌呤饮食、饮酒、含糖饮料、体重变化与部分药物都可能使尿酸升高或波动。
    action: 建议复查并结合是否有红肿热痛等表现判断；明显升高建议到风湿免疫科或内分泌科门诊。

  - code: tc
    plain: 总胆固醇是血脂检查的一项，反映血液中各类胆固醇的总量。它通常需要与低密度、高密度脂蛋白一起看。
    factors: 饮食结构、体重、运动习惯与遗传因素都可能影响总胆固醇水平。
    action: 轻度升高建议复查并调整饮食与运动；明显升高建议到心内科或内分泌科门诊评估心血管风险。

  - code: fpg
    plain: 空腹血糖反映空腹状态下的血糖水平，是筛查糖代谢问题的常用指标。它既可能偏高也可能偏低。
    factors: 抽血前是否真正空腹、前一晚进食与饮酒、睡眠与情绪都可能影响结果。
    action: 偏高建议复查空腹血糖并结合糖化血红蛋白；明显偏低或伴心慌出汗等情况时应尽快就医。

  - code: hgb
    plain: 血红蛋白负责携带氧气，参考区间男女不同。它偏低提示可能存在贫血，偏高则可能与缺氧或血液浓缩有关。
    factors: 营养状况、月经量、慢性失血、居住海拔以及脱水都可能影响血红蛋白数值。
    action: 偏低建议复查并结合血常规其他指标判断原因；明显偏低建议尽快到血液科或内科门诊。
