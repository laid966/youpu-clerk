<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 有谱掌柜 · 极简算盘标：横梁 + 一档 + 双珠，四个几何体、两色、无框无渐变。
       朱砂珠拨上靠梁 = "这笔钱算定了"；灰珠归位 = 其余各安其分；
       两珠之间露出的档 = 算盘的骨架，16px 下仍是清晰剪影。 -->
  <line x1="12" y1="10" x2="52" y2="10" stroke="#221D18" stroke-width="6" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="32" y2="58" stroke="#221D18" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <ellipse cx="32" cy="24" rx="16" ry="10" fill="#C2401D"/>
  <ellipse cx="32" cy="48" rx="11" ry="7" fill="#221D18" opacity=".35"/>
</svg>
